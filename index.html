<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adewa - Security Check</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

  :root {
    --bg: #0f1117;
    --card-bg: #171a22;
    --border: #262a35;
    --text: #f2f3f5;
    --muted: #8b8f9b;
    --accent: #4f8cff;
    --success: #34c777;
    --danger: #ff4d5e;
    --warning: #ffb020;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(79, 140, 255, 0.12);
    transition: background 0.3s ease;
  }

  .icon-wrap.success { background: rgba(52, 199, 119, 0.12); }
  .icon-wrap.danger  { background: rgba(255, 77, 94, 0.12); }
  .icon-wrap.warning { background: rgba(255, 176, 32, 0.12); }

  .icon {
    font-size: 34px;
    line-height: 1;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(79, 140, 255, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h2 {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: 600;
  }

  p.desc {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .badge.danger {
    background: rgba(255, 77, 94, 0.15);
    color: var(--danger);
  }

  .badge.warning {
    background: rgba(255, 176, 32, 0.15);
    color: var(--warning);
  }

  .retry-btn {
    margin-top: 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .retry-btn:active {
    opacity: 0.85;
  }

</style>

</head>

<body>

<div class="card">

  <div class="icon-wrap" id="iconWrap">
    <div class="spinner" id="spinner"></div>
    <span class="icon" id="icon" style="display:none;"></span>
  </div>

  <h2 id="title">Checking your account</h2>
  <p class="desc" id="desc">Please wait a moment...</p>

  <span class="badge" id="badge" style="display:none;"></span>

  <button class="retry-btn" id="retryBtn">Try Again</button>

</div>

<script>

const hasTelegram =
  typeof window.Telegram !== 'undefined' &&
  window.Telegram.WebApp;

const tg = hasTelegram ? window.Telegram.WebApp : null;

if (tg) {
  tg.ready();
  tg.expand();
}

/*
=========================================================
BACKEND BASE URL
(frontend is on GitHub Pages, backend is on Vercel —
must use an absolute URL, a relative path would hit
GitHub Pages instead of the server)
=========================================================
*/

const API_BASE = 'https://adewa.vercel.app';

const els = {
  iconWrap: document.getElementById('iconWrap'),
  spinner: document.getElementById('spinner'),
  icon: document.getElementById('icon'),
  title: document.getElementById('title'),
  desc: document.getElementById('desc'),
  badge: document.getElementById('badge'),
  retryBtn: document.getElementById('retryBtn')
};

/*
=========================================================
UI STATE HELPERS
=========================================================
*/

function setState(type, { icon, title, desc, badge } = {}) {

  els.spinner.style.display = (type === 'loading') ? 'block' : 'none';
  els.icon.style.display = (type === 'loading') ? 'none' : 'block';

  els.iconWrap.className = 'icon-wrap' + (type !== 'loading' ? ' ' + type : '');

  if (icon) els.icon.textContent = icon;
  if (title) els.title.textContent = title;
  if (desc) els.desc.textContent = desc;

  if (badge) {
    els.badge.textContent = badge;
    els.badge.className = 'badge ' + (type === 'success' ? 'success' : type);
    els.badge.style.display = 'inline-block';
  } else {
    els.badge.style.display = 'none';
  }

  els.retryBtn.style.display = (type === 'error') ? 'inline-block' : 'none';
}

/*
=========================================================
DEVICE INSTALLATION ID
=========================================================
*/

let deviceId = localStorage.getItem('device_installation_id');

if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem('device_installation_id', deviceId);
}

/*
=========================================================
BAN REASON TEXT (matches backend ban_reason / getBanType logic)
=========================================================
*/

function describeBan(reason) {

  const r = String(reason || '').toLowerCase();

  if (r.includes('vpn') || r.includes('proxy') || r.includes('tor')) {
    return {
      icon: '🛡️',
      title: 'Access Blocked',
      desc: 'A VPN or proxy connection was detected. Please disable it and use a normal network to continue.',
      badge: 'VPN / PROXY DETECTED'
    };
  }

  if (r.includes('multiple') || r.includes('same device') || r.includes('same ip')) {
    return {
      icon: '👥',
      title: 'Access Blocked',
      desc: 'Multiple Telegram accounts were detected from this device or network. Only one account is allowed.',
      badge: 'MULTIPLE ACCOUNTS DETECTED'
    };
  }

  return {
    icon: '🚫',
    title: 'Account Banned',
    desc: 'Your account has been permanently banned from Adewa.',
    badge: 'BANNED'
  };
}

/*
=========================================================
FETCH WITH TIMEOUT (fixes the "stuck on Checking..." issue)
=========================================================
*/

function fetchWithTimeout(url, options, timeoutMs) {

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    timeoutMs
  );

  return fetch(url, { ...options, signal: controller.signal })
    .finally(() => clearTimeout(timer));
}

/*
=========================================================
AUTHENTICATE
=========================================================
*/

async function authenticate() {

  setState('loading', {
    title: 'Checking your account',
    desc: 'Please wait a moment...'
  });

  if (!hasTelegram) {

    setState('warning', {
      icon: '⚠️',
      title: 'Open in Telegram',
      desc: 'This page must be opened as a Telegram Mini App, not in a regular browser.'
    });

    return;
  }

  const initData = tg.initData;

  if (!initData) {

    setState('warning', {
      icon: '⚠️',
      title: 'Open in Telegram',
      desc: 'This app must be opened from inside Telegram.',
    });

    return;
  }

  try {

    const response = await fetchWithTimeout(
      API_BASE + '/api/auth',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-init-data': initData,
          'x-device': deviceId
        }
      },
      15000 // 15s timeout instead of hanging forever
    );

    const data = await response.json();

    // ---------------------------------------------------
    // BANNED (backend returns status: 'banned', reason: "...")
    // ---------------------------------------------------

    if (data.status === 'banned') {

      const info = describeBan(data.reason);

      setState('danger', info);

      return;
    }

    // ---------------------------------------------------
    // VERIFIED / SUCCESS
    // ---------------------------------------------------

    if (data.ok && data.status === 'verified') {

      setState('success', {
        icon: '✅',
        title: 'Verified',
        desc: 'Security check passed successfully.'
      });

      setTimeout(() => {
        // Redirect or unlock next step here, e.g.:
        // window.location.href = '/home.html';
      }, 800);

      return;
    }

    // ---------------------------------------------------
    // INVALID / OTHER ERROR FROM SERVER
    // ---------------------------------------------------

    setState('error', {
      icon: '❌',
      title: 'Verification Failed',
      desc: data.message || 'Something went wrong. Please try again.'
    });

  } catch (error) {

    console.error(error);

    const timedOut = (error.name === 'AbortError');

    setState('error', {
      icon: '📡',
      title: timedOut ? 'Connection Timed Out' : 'Connection Error',
      desc: timedOut
        ? 'The server took too long to respond. Check your connection and try again.'
        : 'Could not reach the server. Please try again.'
    });
  }
}

els.retryBtn.addEventListener('click', authenticate);

authenticate();

</script>

</body>

</html>
