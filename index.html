<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adewa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0b0d10; --s1:#12151a; --s2:#181c22; --s3:#20252d; --line:#252b34;
  --text:#eef1f5; --mut:#8b95a5; --dim:#5c6572;
  --blue:#4da3ff; --green:#34d27f; --violet:#a08bff; --amber:#ffb53d;
  --rose:#ff6b85; --teal:#2dd4c4; --orange:#ff8a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Ethiopic","Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

.screen{display:none;min-height:100vh}
.screen.active{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* ---------- splash ---------- */
.logo-wrap{position:relative;width:108px;height:108px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;
  animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both, ring 2s ease-out .6s infinite}
.logo-wrap img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--bg)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(77,163,255,.45)}70%{box-shadow:0 0 0 24px rgba(77,163,255,0)}100%{box-shadow:0 0 0 0 rgba(77,163,255,0)}}
.splash-title{margin-top:24px;font-size:24px;font-weight:700;letter-spacing:.3px;opacity:0;animation:up .6s ease .35s forwards}
.splash-sub{margin-top:6px;color:var(--mut);font-size:13px;opacity:0;animation:up .6s ease .55s forwards}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dots{display:flex;gap:6px;margin-top:28px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bounce 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:none;opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* ---------- status ---------- */
.status-card{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:30px 22px}
.status-card .ico{width:64px;height:64px;border-radius:50%;margin:0 auto 18px}
.status-card .ico svg{width:30px;height:30px}
.status-card h2{font-size:19px;margin-bottom:8px}
.status-card p{color:var(--mut);font-size:14px}
.spin{width:30px;height:30px;border:3px solid rgba(77,163,255,.2);border-top-color:var(--blue);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- shared ---------- */
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:32px;height:32px;border-radius:10px}.ico.sm svg{width:16px;height:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.h{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:24px 4px 10px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.b{font-weight:700}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mut);text-align:center;padding:28px 12px;font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s3);color:var(--mut)}
.chip.green{background:rgba(52,210,127,.14);color:var(--green)}
.chip.amber{background:rgba(255,181,61,.14);color:var(--amber)}
.chip.rose{background:rgba(255,107,133,.14);color:var(--rose)}
.chip.blue{background:rgba(77,163,255,.14);color:var(--blue)}

.btn{height:44px;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;color:#0b0d10;background:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.btn.green{background:var(--green)}.btn.violet{background:var(--violet)}.btn.amber{background:var(--amber)}
.btn.rose{background:var(--rose)}.btn.orange{background:var(--orange)}
.btn.ghost{background:var(--s3);color:var(--text)}
.btn.s{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.inp{width:100%;height:44px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0}
.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
select.inp{appearance:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin:0 2px 6px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--dim);margin:5px 2px 0}

.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border:0;background:none;border-radius:9px;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--s3);color:var(--text)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--mut);font-weight:700;font-size:13px;cursor:pointer}
.chips button.on{background:var(--rose);border-color:var(--rose);color:#0b0d10}

/* ---------- app shell ---------- */
#app{padding-bottom:86px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;
  padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}
.brand .lg{position:relative;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:14px;color:#fff}
.brand .lg img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--bg)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(255,107,133,.14);color:var(--rose)}
.pages{padding:6px 16px 20px;max-width:520px;margin:0 auto}
.page{display:none}.page.active{display:block;animation:up .22s ease}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(18,21,26,.96);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px);z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--c)}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);max-width:88%;
  background:var(--s3);border:1px solid var(--line);border-left:3px solid var(--blue);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
  z-index:50;transition:transform .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--rose)}

/* ---------- home ---------- */
.bal{position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,181,61,.16),transparent 70%)}
.bal .lbl{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bal .big{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:38px;font-weight:800;letter-spacing:-.5px}
.bal .big svg{width:32px;height:32px}
.bal .sub{margin-top:6px;color:var(--mut);font-size:13px}
.streak-bar{display:flex;gap:5px;margin-top:14px}
.streak-bar i{flex:1;height:6px;border-radius:3px;background:var(--s3)}
.streak-bar i.on{background:var(--orange)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--mut)}
.wheel-box{position:relative;width:210px;height:210px;margin:6px auto 16px}
.wheel-box svg{width:100%;height:100%;overflow:visible}
.wheel-box .ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--text);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.winner{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.winner:last-child{border-bottom:0}

/* ---------- earn ---------- */
.ringbox{position:relative;width:150px;height:150px;margin:8px auto 14px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--s3);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .mid b{font-size:30px;line-height:1}.ringbox .mid span{font-size:11.5px;color:var(--mut);margin-top:4px}
.task{display:flex;gap:12px;align-items:flex-start}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.task .acts{display:flex;gap:8px;margin-top:12px}
.task .acts .btn{flex:1}

/* ---------- invite / profile ---------- */
.linkbox{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.linkbox span{flex:1;min-width:0;font-size:12.5px;color:var(--mut)}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.rank{width:26px;height:26px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut);flex:none}
.rank.r1{background:rgba(255,181,61,.18);color:var(--amber)}.rank.r2{background:rgba(160,139,255,.18);color:var(--violet)}.rank.r3{background:rgba(255,138,74,.18);color:var(--orange)}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:#0b0d10;margin:0 auto 10px}
.req{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.req:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}

/* ---------- admin ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.proofimg{width:100%;border-radius:10px;margin-top:10px;background:var(--s2)}
.addr{word-break:break-all;font-size:12.5px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
/* ---------- refresh: look & responsiveness ---------- */
:root{--bg:#080a0e;--s1:#11151c;--s2:#171c25;--s3:#1f2632;--line:#242c39;--r:18px}
html,body{background:radial-gradient(900px 500px at 50% -10%,rgba(77,163,255,.10),transparent 60%),var(--bg);background-attachment:fixed;font-size:clamp(14.5px,3.6vw,16px)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--s1);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.btn{height:48px;border-radius:14px;background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background-image:none;box-shadow:none}.btn.s{height:38px}
.inp{height:48px;border-radius:14px;transition:border-color .15s,box-shadow .15s}.inp:focus{box-shadow:0 0 0 3px rgba(77,163,255,.18)}
.bal{background:linear-gradient(135deg,#14202f,#11151c 60%)!important}
.bal .big{font-size:clamp(34px,10vw,46px)}
.stat{border-radius:16px;background:var(--s1);transition:transform .15s}.stat:hover{transform:translateY(-2px)}
.chip{padding:4px 10px}.seg,.linkbox{border-radius:14px}
.nav{max-width:560px;margin:0 auto;left:50%;right:auto;width:100%;transform:translateX(-50%);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;background:rgba(17,21,28,.82);backdrop-filter:blur(16px)}
.nav button{border-radius:14px;transition:color .15s,transform .12s}.nav button:active{transform:scale(.93)}
.nav button.on svg{filter:drop-shadow(0 0 6px currentColor)}
.chips button{transition:transform .12s,background .15s}.chips button:active{transform:scale(.95)}
.toast{border-radius:14px;backdrop-filter:blur(10px)}
.pages{max-width:560px}
@media (min-width:720px){
  .pages{max-width:760px;padding:10px 24px 28px}
  .stat-grid{gap:14px}.agrid{grid-template-columns:repeat(3,1fr)}
  #adminBody .card .field{max-width:520px}
  .top{max-width:760px;margin:0 auto;padding-left:24px;padding-right:24px}
  .nav{max-width:560px;bottom:12px;border-radius:22px;border-bottom:1px solid var(--line)}
}
@media (min-width:1100px){.pages,.top{max-width:920px}}
@media (max-width:360px){.stat b{font-size:16px}.btn{padding:0 12px}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<!-- ============ SPLASH ============ -->
<div class="screen active" id="splash">
  <div class="center">
    <div class="logo-wrap">A<img src="logo.png" alt="Adewa" onerror="this.remove()"></div>
    <div class="splash-title" id="appName1">Adewa</div>
    <div class="splash-sub">Welcome to your Mini App</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- ============ STATUS ============ -->
<div class="screen" id="status">
  <div class="center">
    <div class="status-card">
      <div class="ico" id="stIcon"></div>
      <h2 id="stTitle"></h2>
      <p id="stDesc"></p>
      <div id="stBadge" style="margin-top:16px"></div>
      <button class="btn block" id="stRetry" style="margin-top:18px;display:none" data-act="retry">Try again</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="screen" id="app">
  <div class="top">
    <div class="brand"><span class="lg">A<img src="logo.png" alt="" onerror="this.remove()"></span><span id="appName2">Adewa</span></div>
    <span class="pill" id="adminPill" style="display:none">ADMIN</span>
  </div>

  <div class="pages">
    <div class="page active" id="page-home"></div>
    <div class="page" id="page-earn"></div>
    <div class="page" id="page-invite"></div>
    <div class="page" id="page-profile"></div>
    <div class="page" id="page-admin"></div>
  </div>

  <div class="nav" id="nav"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* =========================================================
   BASICS
   ========================================================= */

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b0d10'); tg.setBackgroundColor('#0b0d10'); } } catch (e) {}

const API = 'https://adewa.vercel.app';
const $ = (s, r = document) => r.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const C = { blue: '#4da3ff', green: '#34d27f', violet: '#a08bff', amber: '#ffb53d', rose: '#ff6b85', teal: '#2dd4c4', orange: '#ff8a4a' };

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* ---------- icon set (stroke icons, each used in its own colour) ---------- */
const P = {
  home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.5-.8-1.5-1.3-2.6-1.3-1.5 0-2.6.8-2.6 2 0 2.8 5.4 1.2 5.4 4.1 0 1.2-1.2 2.1-2.8 2.1-1.2 0-2.2-.5-2.8-1.4M12 6.2v1.7m0 8.2v1.7"/>',
  earn: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10.2c0-1 1.3-1.7 3-1.7s3 .7 3 1.8c0 2.5-6 1.2-6 3.8 0 1.1 1.3 1.9 3 1.9s3-.8 3-1.8"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  megaphone: '<path d="m3 11 18-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/>',
  checksq: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  wallet: '<path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v3"/><path d="M3 6v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/>',
  flame: '<path d="M12 22a7 7 0 0 0 7-7c0-3-1.5-5-3-7-.5 2-2 3-3 3 0-3-1-6-4-8 .5 4-4 6-4 12a7 7 0 0 0 7 7z"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  shieldx: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9.5 9.5 5 5M14.5 9.5l-5 5"/>',

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

/* ---------- misc helpers ---------- */
let deviceId = null;
try { deviceId = localStorage.getItem('device_installation_id'); } catch (e) {}
if (!deviceId) {
  deviceId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2);
  try { localStorage.setItem('device_installation_id', deviceId); } catch (e) {}
}

function fetchT(url, opt, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  return fetch(url, Object.assign({}, opt, { signal: ctl.signal })).finally(() => clearTimeout(timer));
}

const hdr = () => ({ 'Content-Type': 'application/json', 'x-init-data': tg ? tg.initData : '', 'x-device': deviceId });

async function api(path, o) {
  o = o || {};
  const res = await fetchT(API + path, { method: o.method || 'GET', headers: hdr(), body: o.body ? JSON.stringify(o.body) : undefined }, 20000);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.message || 'Request failed');
  return data;
}

function openUrl(u) {
  if (!u) return;
  if (tg) { /^https:\/\/t\.me\//.test(u) ? tg.openTelegramLink(u) : tg.openLink(u); }
  else window.open(u, '_blank');
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); } catch (e2) {} a.remove();
  }
  toast('Copied', 'ok');
}

function timeAgo(iso) {
  const s = Math.max(1, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function loadScript(src) {
  loadScript.c = loadScript.c || {};
  if (!loadScript.c[src]) {
    loadScript.c[src] = new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src));
      document.head.appendChild(s);
    });
  }
  return loadScript.c[src];
}

function setStatus(o) {
  show('status');
  const color = { danger: C.rose, warning: C.amber, error: C.rose, loading: C.blue }[o.type] || C.blue;
  const box = $('#stIcon');
  box.style.color = color;
  box.style.background = hexA(color, 0.14);
  box.innerHTML = o.type === 'loading' ? '<div class="spin"></div>' : svg(o.icon);

  $('#stRetry').style.display = o.retry ? 'flex' : 'none';
}

function describeBan(reason) {
  const r = String(reason || '').toLowerCase();
  if (r.includes('vpn') || r.includes('proxy') || r.includes('tor')) {
    return { type: 'danger', icon: 'shieldx', title: 'Access blocked', desc: 'A VPN or proxy connection was detected. Your account has been permanently banned.', badge: 'VPN / PROXY DETECTED' };
  }
  if (r.includes('multiple') || r.includes('same device') || r.includes('same ip')) {
    return { type: 'danger', icon: 'users', title: 'Access blocked', desc: 'Multiple Telegram accounts were detected from this device or network. Only one account is allowed.', badge: 'MULTIPLE ACCOUNTS DETECTED' };
  }
  return { type: 'danger', icon: 'ban', title: 'Account banned', desc: 'Your account has been permanently banned from Adewa.', badge: 'BANNED' };
}

async function authenticate() {
  if (!tg || !tg.initData) {
    return { status: { type: 'warning', icon: 'alert', title: 'Open in Telegram', desc: 'This app must be opened from inside Telegram.' } };
  }
  try {
    const res = await fetchT(API + '/api/auth', { method: 'POST', headers: hdr() }, 15000);
    const d = await res.json();
    if (d.status === 'banned') return { status: describeBan(d.reason) };
    if (d.ok && d.status === 'verified') return { ok: true, admin: d.admin === true };
    return { status: { type: 'error', icon: 'xcircle', title: 'Verification failed', desc: d.message || 'Something went wrong.', retry: true } };
  } catch (e) {
    const t = e.name === 'AbortError';
    return { status: { type: 'error', icon: 'wifi', title: t ? 'Connection timed out' : 'Connection error', desc: t ? 'The server took too long to respond.' : 'Could not reach the server.', retry: true } };
  }
}

async function loadMe() {
  S.me = await api('/api/me');
  const n = S.me.app_name || 'Adewa';
  document.title = n;
  ['appName1', 'appName2'].forEach((id) => { const e = document.getElementById(id); if (e) e.textContent = n; });
}

async function boot() {
  show('splash');
  const parts = await Promise.all([authenticate(), sleep(1700)]);
  const r = parts[0];
  if (!r.ok) return setStatus(r.status);
  try { await loadMe(); }
  catch (e) { return setStatus({ type: 'error', icon: 'wifi', title: 'Could not load your account', desc: e.message, retry: true }); }
  enterApp(r.admin);
}

function wheelSvg(rewards) {
  const n = rewards.length, R = 100, cols = [C.blue, C.violet, C.green, C.amber, C.rose, C.teal, C.orange];
  let s = '<svg viewBox="-104 -104 208 208"><circle r="103" fill="#1a1e25"/><g id="wheelG">';
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
    const x0 = R * Math.cos(a0), y0 = R * Math.sin(a0), x1 = R * Math.cos(a1), y1 = R * Math.sin(a1);
    s += '<path d="M0 0L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A' + R + ' ' + R + ' 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + 'Z" fill="' + cols[i % cols.length] + '" stroke="#12151a" stroke-width="2"/>';
    const mid = ((i + 0.5) / n) * 360;
    s += '<text transform="rotate(' + mid + ') translate(0 -66)" text-anchor="middle" font-size="16" font-weight="800" fill="#0b0d10">' + rewards[i] + '</text>';
  }
  return s + '</g><circle r="16" fill="#12151a" stroke="#252b34" stroke-width="2"/></svg>';
}

/* ---------- ads ---------- */
async function showAd(provider, cfg) {
  if (provider === 'adsgram') {
    if (!cfg.adsgram_block_id) throw new Error('Adsgram not configured');
    await loadScript('https://sad.adsgram.ai/js/sad.min.js');
    const r = await window.Adsgram.init({ blockId: cfg.adsgram_block_id }).show();
    if (!r || !r.done) throw new Error('Ad not completed');
    return;
  }
  if (provider === 'adsbitvex') {
    if (!cfg.adsbitvex_script) throw new Error('Adsbitvex not configured');
    await loadScript(cfg.adsbitvex_script);
    if (typeof window.showadsbitvex !== 'function') throw new Error('Adsbitvex SDK not available');
    await window.showadsbitvex();
    return;
  }
  throw new Error('Unknown provider');
}

H.watch = async () => {
  const a = S.me.ads;
  if (a.watched >= a.limit) throw new Error('Daily ad limit reached. Come back tomorrow.');
  const s = await api('/api/ads/start', { method: 'POST' });

  let used = null;
  const order = [s.provider, s.fallback];
  for (let i = 0; i < order.length; i++) {
    try { await showAd(order[i], s.config); used = order[i]; break; }
    catch (e) { console.warn(order[i], e.message); }
  }
  if (!used) throw new Error('No ad is available right now. Please try again in a moment.');

  const r = await api('/api/ads/complete', { method: 'POST', body: { token: s.token, provider: used } });
  toast('+' + r.reward + ' coins', 'ok');
  await refresh();
};

  o = o || {};
  const inner = o.area
    ? '<textarea class="inp" id="' + id + '" placeholder="' + esc(o.ph || '') + '">' + esc(o.value || '') + '</textarea>'
    : o.options
      ? '<select class="inp" id="' + id + '">' + o.options.map((x) => '<option value="' + x[0] + '">' + x[1] + '</option>').join('') + '</select>'
      : '<input class="inp" id="' + id + '" type="' + (o.type || 'text') + '" value="' + esc(o.value == null ? '' : o.value) + '" placeholder="' + esc(o.ph || '') + '">';
  return '<div class="field"><label>' + label + '</label>' + inner + (o.hint ? '<div class="hint">' + o.hint + '</div>' : '') + '</div>';

  await api('/api/admin/channels', { method: 'POST', body: { chat_id: val('c_id'), title: val('c_title'), invite_link: val('c_link') } });
  toast('Channel added', 'ok'); loadAdminTab();
};
H.delChannel = async (el) => { await api('/api/admin/channels/' + el.dataset.id, { method: 'DELETE' }); toast('Channel removed', 'ok'); loadAdminTab(); };

AV.broadcast = (b) => {
  b.innerHTML = '<div class="card"><div class="row" style="margin-bottom:14px">' + ico('bell', C.blue) + '<div class="b">Push notification</div></div>' +
    fld('Message', 'b_text', { area: true, ph: 'A new high paying task is live. Open Adewa now.', hint: 'Sent to every verified user through the bot.' }) +
    '<button class="btn block" data-act="broadcast">' + svg('send') + 'Send to all users</button></div>';
};

H.broadcast = async () => {
  const text = val('b_text'); if (!text) throw new Error('Write a message first.');
  const d = await api('/api/admin/broadcast', { method: 'POST', body: { text } });
  toast('Delivered to ' + d.sent + ' of ' + d.total + ' users', 'ok');
  $('#b_text').value = '';
};

/* =========================================================
   START
   ========================================================= */

boot();
</script>
</body>
</html>
