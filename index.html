<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adewa Security Check</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  background: #f5f7fa;
  color: #111827;
}

.security-screen {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;
}

.security-card {
  width: 100%;
  max-width: 420px;

  background: #ffffff;

  border-radius: 24px;

  padding: 32px 24px;

  text-align: center;

  box-shadow:
    0 10px 40px rgba(0, 0, 0, 0.08);
}

.icon {
  width: 72px;
  height: 72px;

  margin: 0 auto 20px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 34px;

  background: #eef2f7;
}

.security-card h2 {
  margin: 0 0 12px;

  font-size: 24px;
  font-weight: 700;
}

.security-card p {
  margin: 0;

  font-size: 15px;

  line-height: 1.6;

  color: #667085;
}

.loading-spinner {
  width: 38px;
  height: 38px;

  margin: 0 auto 20px;

  border: 4px solid #e5e7eb;
  border-top-color: #111827;

  border-radius: 50%;

  animation: spin 0.8s linear infinite;
}

@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

.hidden {
  display: none !important;
}

.banned {
  background: #fff1f2;
}

.banned .security-card {
  border: 1px solid #fecdd3;
}

.banned .icon {
  background: #fee2e2;
}

.banned h2 {
  color: #b91c1c;
}

.success {
  background: #f0fdf4;
}

.success .security-card {
  border: 1px solid #bbf7d0;
}

.success .icon {
  background: #dcfce7;
}

.success h2 {
  color: #15803d;
}

.error {
  background: #fff7ed;
}

.error .security-card {
  border: 1px solid #fed7aa;
}

.error .icon {
  background: #ffedd5;
}

.error h2 {
  color: #c2410c;
}

</style>

</head>

<body>

<!-- =====================================================
     SECURITY CHECK SCREEN
===================================================== -->

<div
  id="securityScreen"
  class="security-screen"
>

  <div
    id="securityCard"
    class="security-card"
  >

    <div
      id="securityIcon"
      class="icon"
    >
      <div
        id="spinner"
        class="loading-spinner"
      ></div>
    </div>

    <h2 id="securityTitle">
      Security Check
    </h2>

    <p id="status">
      Checking your account...
    </p>

  </div>

</div>


<script>

/*
=========================================================
TELEGRAM WEB APP
=========================================================
*/

const tg =
  window.Telegram &&
  window.Telegram.WebApp;


/*
=========================================================
BACKEND URL
=========================================================
*/

const API_URL =
  'https://adewa.vercel.app';


/*
=========================================================
INITIALIZE TELEGRAM
=========================================================
*/

if (!tg) {

  showError(
    'Open this Mini App from Telegram.'
  );

} else {

  tg.ready();

  tg.expand();

  authenticate();

}


/*
=========================================================
CREATE DEVICE INSTALLATION ID
=========================================================
*/

let deviceId =
  localStorage.getItem(
    'device_installation_id'
  );


if (!deviceId) {

  if (
    window.crypto &&
    typeof crypto.randomUUID === 'function'
  ) {

    deviceId =
      crypto.randomUUID();

  } else {

    deviceId =
      'device-' +
      Date.now() +
      '-' +
      Math.random()
        .toString(36)
        .substring(2);

  }

  localStorage.setItem(
    'device_installation_id',
    deviceId
  );

}


/*
=========================================================
GET DOM ELEMENTS
=========================================================
*/

const securityScreen =
  document.getElementById(
    'securityScreen'
  );

const securityCard =
  document.getElementById(
    'securityCard'
  );

const securityIcon =
  document.getElementById(
    'securityIcon'
  );

const spinner =
  document.getElementById(
    'spinner'
  );

const securityTitle =
  document.getElementById(
    'securityTitle'
  );

const statusText =
  document.getElementById(
    'status'
  );


/*
=========================================================
SHOW LOADING
=========================================================
*/

function showLoading(message) {

  securityScreen.className =
    'security-screen';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML = `
    <div class="loading-spinner"></div>
  `;

  securityTitle.textContent =
    'Security Check';

  statusText.textContent =
    message ||
    'Checking your account...';

}


/*
=========================================================
SHOW SUCCESS
=========================================================
*/

function showSuccess(message) {

  securityScreen.className =
    'security-screen success';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '✓';

  securityTitle.textContent =
    'Verification Successful';

  statusText.textContent =
    message ||
    'Your verification is successfully.';

}


/*
=========================================================
SHOW VPN / PROXY BAN
=========================================================
*/

function showVpnBan() {

  securityScreen.className =
    'security-screen banned';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '🚫';

  securityTitle.textContent =
    'Account Permanently Banned';

  statusText.innerHTML = `
    <strong>
      🚫 VPN/Proxy detected.
    </strong>

    <br><br>

    Your account has been permanently
    banned from Adewa.
  `;

  /*
  Prevent Telegram Mini App from being
  used normally after ban.
  */

  disableApp();

}


/*
=========================================================
SHOW MULTIPLE ACCOUNT BAN
=========================================================
*/

function showMultipleAccountBan() {

  securityScreen.className =
    'security-screen banned';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '🚫';

  securityTitle.textContent =
    'Account Permanently Banned';

  statusText.innerHTML = `
    <strong>
      🚫 Multiple accounts detected.
    </strong>

    <br><br>

    Your account has been permanently
    banned from Adewa.
  `;

  /*
  Prevent Telegram Mini App from being
  used normally after ban.
  */

  disableApp();

}


/*
=========================================================
SHOW GENERIC BAN
=========================================================
*/

function showGenericBan() {

  securityScreen.className =
    'security-screen banned';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '🚫';

  securityTitle.textContent =
    'Account Permanently Banned';

  statusText.innerHTML = `
    <strong>
      🚫 Account blocked.
    </strong>

    <br><br>

    Your account has been permanently
    banned from Adewa.
  `;

  disableApp();

}


/*
=========================================================
SHOW TELEGRAM REQUIRED ERROR
=========================================================
*/

function showTelegramError() {

  securityScreen.className =
    'security-screen error';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '⚠️';

  securityTitle.textContent =
    'Telegram Required';

  statusText.textContent =
    'Open this Mini App from Telegram.';

}


/*
=========================================================
SHOW SERVER ERROR
=========================================================
*/

function showError(message) {

  securityScreen.className =
    'security-screen error';

  securityCard.className =
    'security-card';

  securityIcon.innerHTML =
    '⚠️';

  securityTitle.textContent =
    'Connection Error';

  statusText.textContent =
    message ||
    'Server connection error.';

}


/*
=========================================================
DISABLE APP AFTER BAN
=========================================================
*/

function disableApp() {

  /*
  Hide everything except the security screen.
  */

  document
    .querySelectorAll(
      'button, input, select, textarea, a'
    )
    .forEach(
      element => {

        element.disabled =
          true;

        element.style.pointerEvents =
          'none';

      }
    );


  /*
  Disable keyboard interactions.
  */

  document.addEventListener(
    'keydown',
    function(event) {

      event.preventDefault();

    },
    true
  );


  /*
  Prevent clicks outside the security card.
  */

  document.addEventListener(
    'click',
    function(event) {

      if (
        !securityCard.contains(
          event.target
        )
      ) {

        event.preventDefault();

        event.stopPropagation();

      }

    },
    true
  );

}


/*
=========================================================
DETECT BAN REASON
=========================================================
*/

function handleBanReason(
  reason
) {

  const text =
    String(
      reason || ''
    ).toLowerCase();


  /*
  VPN / PROXY / TOR
  */

  if (
    text.includes('vpn') ||
    text.includes('proxy') ||
    text.includes('tor')
  ) {

    showVpnBan();

    return;

  }


  /*
  MULTIPLE ACCOUNT
  */

  if (
    text.includes('multiple') ||
    text.includes('multi account') ||
    text.includes('multi-account') ||
    text.includes('different telegram account') ||
    text.includes('same device')
  ) {

    showMultipleAccountBan();

    return;

  }


  /*
  UNKNOWN BAN
  */

  showGenericBan();

}


/*
=========================================================
AUTHENTICATION
=========================================================
*/

async function authenticate() {

  showLoading(
    'Checking your account...'
  );


  /*
  Telegram initData
  */

  const initData =
    tg &&
    tg.initData;


  /*
  Mini App must be opened from Telegram.
  */

  if (!initData) {

    showTelegramError();

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        '/api/auth',
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json',

            'x-init-data':
              initData,

            'x-device':
              deviceId

          }

        }
      );


    /*
    Try to read JSON response.
    */

    let data = null;

    try {

      data =
        await response.json();

    } catch {

      data = null;

    }


    /*
    =====================================================
    HTTP 403 = BANNED
    =====================================================
    */

    if (
      response.status === 403
    ) {

      /*
      Backend sends:

      {
        ok: false,
        status: "banned",
        reason: "...",
        message: "..."
      }
      */

      if (
        data &&
        data.status === 'banned'
      ) {

        handleBanReason(
          data.reason
        );

        return;

      }


      /*
      Even if reason is missing,
      403 from security endpoint
      is treated as banned.
      */

      showGenericBan();

      return;

    }


    /*
    =====================================================
    OTHER SERVER ERRORS
    =====================================================
    */

    if (!response.ok) {

      showError(
        data &&
        data.message
          ? data.message
          : 'Security verification failed.'
      );

      return;

    }


    /*
    =====================================================
    SUCCESS
    =====================================================
    */

    if (
      data &&
      data.ok &&
      data.status === 'verified'
    ) {

      showSuccess(
        data.message ||
        'Your verification is successfully.'
      );


      console.log(
        'Security verification:',
        data
      );


      /*
      IMPORTANT:
      ================================================
      If you have your real Adewa app UI,
      this is where it should be opened.
      ================================================
      */

      /*
      Example:

      loadAdewaApp();

      */


      return;

    }


    /*
    =====================================================
    UNEXPECTED RESPONSE
    =====================================================
    */

    showError(
      data &&
      data.message
        ? data.message
        : 'Security check failed.'
    );


  } catch (error) {

    console.error(
      'Authentication error:',
      error
    );

    showError(
      'Server connection error. Please try again.'
    );

  }

}

</script>

</body>

</html>
